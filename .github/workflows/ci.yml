name: SENTINEL CI

on:
  push:
    branches: [ main, ml_advancements ]
  pull_request:
    branches: [ main, ml_advancements ]

jobs:
  backend-tests:
    name: Backend Pytest & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: python -m pytest backend/tests -v

      - name: Compile Backend Modules
        run: python -m compileall -q backend

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sentinel-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: sentinel-frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: sentinel-frontend
        run: npm run lint

      - name: Build Frontend (Production)
        working-directory: sentinel-frontend
        run: npm run build

      - name: Build Frontend (Mock Mode)
        working-directory: sentinel-frontend
        run: npm run build
        env:
          VITE_USE_MOCK_DATA: 'true'
